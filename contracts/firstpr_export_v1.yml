# Data contract between OSS Pulse and the FirstPR recommender.
#
# Additive changes (new nullable columns) bump the minor version. Removing or renaming a
# column, changing a type or tightening semantics needs firstpr_export_v2.yml.
contract: firstpr_export
version: "1.1.0"
owner: oss-pulse
consumer: firstpr
artifact: gold/firstpr_export.parquet
grain: one row per repository
refresh: daily, after the previous day's 24 hours are ingested
rows: every scored repository, plus any active non-archived repository with an open good first issue
window: rolling 30 complete UTC days, stated in window_start and window_end
caveats:
  - GH Archive captures roughly 1.2% of events, so per-repo samples are small. Use the sample-size columns.
  - Response times are first observed responses, so they are upper bounds on the true first response.
  - Merge rates are not corrected for under-captured closes. See reports/fallback_validation.json.
columns:
  - {name: export_version, type: VARCHAR, nullable: false, equals: v1, description: Contract major version}
  - {name: repo_id, type: BIGINT, nullable: false, unique: true, description: GitHub repository id. Stable across renames.}
  - {name: repo_name, type: VARCHAR, nullable: false, description: owner/name as most recently observed}
  - {name: language, type: VARCHAR, nullable: true, description: Primary language from the REST API. Null when not enriched.}
  - {name: topics, type: "VARCHAR[]", nullable: false, description: Repository topics. Empty when not enriched.}
  - {name: license, type: VARCHAR, nullable: true, description: SPDX id}
  - {name: description, type: VARCHAR, nullable: true, description: Repository description}
  - {name: archived, type: BOOLEAN, nullable: false, description: True when archived. False when not enriched.}
  - {name: stargazers_count, type: BIGINT, nullable: true, description: Lifetime stars at enrichment time}
  - {name: friendliness_score, type: DOUBLE, nullable: true, min: 0, max: 100, description: Baseline composite score. Null when the repo does not meet the evidence gate.}
  - {name: friendliness_rank, type: BIGINT, nullable: true, min: 1, description: 1 is friendliest}
  - {name: friendliness_best_rank, type: BIGINT, nullable: true, min: 1, description: Best rank across weighting scenarios}
  - {name: friendliness_worst_rank, type: BIGINT, nullable: true, min: 1, description: Worst rank across weighting scenarios}
  - {name: score_components_present, type: BIGINT, nullable: false, min: 0, max: 6, description: Components with evidence}
  - {name: issue_first_response_median_h, type: DOUBLE, nullable: true, min: 0, description: Median first observed maintainer response on external issues}
  - {name: issue_responses, type: BIGINT, nullable: false, min: 0, description: Sample size for the issue response median}
  - {name: pr_first_response_median_h, type: DOUBLE, nullable: true, min: 0, description: Median first observed maintainer response on external PRs}
  - {name: pr_responses, type: BIGINT, nullable: false, min: 0, description: Sample size for the PR response median}
  - {name: external_pr_merge_rate, type: DOUBLE, nullable: true, min: 0, max: 1, description: merged / (merged + closed unmerged) for fork PRs from non-maintainers}
  - {name: external_prs_resolved, type: BIGINT, nullable: false, min: 0, description: Sample size for the external merge rate}
  - {name: first_time_pr_merge_rate, type: DOUBLE, nullable: true, min: 0, max: 1, description: Merge rate for first-time contributors. A proxy. See docs/metrics.md.}
  - {name: first_time_prs_resolved, type: BIGINT, nullable: false, min: 0, description: Sample size for the first-time merge rate}
  - {name: time_to_merge_median_h, type: DOUBLE, nullable: true, min: 0, description: Median hours from creation to merge for human PRs merged in the window}
  - {name: gfi_pickup_median_h, type: DOUBLE, nullable: true, min: 0, description: Median hours from labelling to first contributor action}
  - {name: gfi_pickups, type: BIGINT, nullable: false, min: 0, description: Sample size for the pickup median}
  - {name: stars_gained, type: BIGINT, nullable: false, min: 0, description: Observed stars in the window. About 1.2% of the true count.}
  - {name: forks_gained, type: BIGINT, nullable: false, min: 0, description: Observed forks in the window}
  - {name: active_days, type: BIGINT, nullable: false, min: 1, description: Days with non-bot activity}
  - {name: distinct_maintainers_acting, type: BIGINT, nullable: false, min: 0, description: Bus factor proxy}
  - {name: human_events, type: BIGINT, nullable: false, min: 1, description: Non-bot events in the window}
  - {name: external_contributors, type: BIGINT, nullable: false, min: 0, description: Distinct non-maintainers who engaged}
  - {name: open_good_first_issue_count, type: BIGINT, nullable: false, min: 0, description: Open good first issues at last observation}
  - name: open_good_first_issues
    type: "STRUCT(issue_number BIGINT, title VARCHAR, url VARCHAR, labels VARCHAR[], created_at TIMESTAMP, last_seen_at TIMESTAMP, comment_count BIGINT, picked_up BOOLEAN)[]"
    nullable: false
    description: Open good first issues, newest first. State is as last observed in the window.
  - {name: window_start, type: TIMESTAMP, nullable: false, description: Inclusive window start in UTC}
  - {name: window_end, type: TIMESTAMP, nullable: false, description: Exclusive window end in UTC}
