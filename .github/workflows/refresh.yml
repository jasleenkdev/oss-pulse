name: refresh

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Free runners have 7 GB of memory. Each hour is streamed and its download deleted.
      OSS_PULSE_DUCKDB_MEMORY: 4GB
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dependencies
        run: make setup

      - name: Restore recent partitions
        uses: actions/cache/restore@v4
        with:
          path: |
            data/bronze
            data/audit
            data/rejects
            data/enrichment/cache
          key: pipeline-${{ github.run_id }}
          restore-keys: pipeline-

      - name: Pick the day to ingest
        id: day
        run: echo "value=$(date -u -d yesterday +%F)" >> "$GITHUB_OUTPUT"

      - name: Ingest the previous day's 24 hours
        run: .venv/bin/python -m oss_pulse.cli backfill --days 1 --end-date ${{ steps.day.outputs.value }} --workers 4

      # Only does work after a cold cache: existing partitions are skipped.
      - name: Fill any gaps in the rolling window
        run: .venv/bin/python -m oss_pulse.cli backfill --days 7 --end-date ${{ steps.day.outputs.value }} --workers 4

      - name: Drop partitions outside the window
        run: .venv/bin/python -m oss_pulse.cli prune --keep-days 7

      - name: Show disk use
        run: df -h . && du -sh data

      - name: Run dbt, the contract check and the extracts
        run: make build

      - name: Check source freshness
        run: make freshness

      - name: Save partitions for tomorrow
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/bronze
            data/audit
            data/rejects
            data/enrichment/cache
          key: pipeline-${{ github.run_id }}

      - name: Publish extracts to the data branch
        run: sh scripts/publish_extracts.sh ${{ steps.day.outputs.value }}

      - name: Build the dashboard
        run: make dashboard

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/dist

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
