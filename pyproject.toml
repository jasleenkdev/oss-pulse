[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oss-pulse"
version = "0.1.0"
description = "Batch pipeline measuring how newcomer-friendly open source repositories are, built on GH Archive."
requires-python = ">=3.11"
dependencies = [
  "dagster>=1.13,<1.14",
  "dagster-webserver>=1.13,<1.14",
  "dagster-dbt>=0.29,<0.30",
  "dbt-core>=1.10,<1.13",
  "dbt-duckdb>=1.10,<1.12",
  "duckdb>=2.0,<2.1",
  "pyarrow>=20",
  "requests>=2.32",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  # dbt-core caps protobuf below 7; newer health-checking builds need protobuf 7.
  "grpcio-health-checking==1.76.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
oss-pulse = "oss_pulse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["dashboard", "dbt/target"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
